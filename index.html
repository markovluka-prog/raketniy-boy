<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аркады</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #1a0f2e 0%, #05010a 75%);
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #title {
    font-size: 40px;
    letter-spacing: 8px;
    color: #9be7ff;
    text-shadow: 0 0 12px #2ad4ff, 0 0 30px #2ad4ff;
    text-align: center;
    animation: titlePulse 2.4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 12px #2ad4ff, 0 0 30px #2ad4ff; }
    50% { text-shadow: 0 0 20px #6fe8ff, 0 0 46px #2ad4ff; }
  }

  #games {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
    padding: 0 20px;
  }

  .game-card {
    width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px 22px;
    background: rgba(10, 4, 20, 0.55);
    border: 2px solid rgba(107, 214, 255, 0.35);
    border-radius: 16px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .game-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: rgba(107, 214, 255, 0.9);
    box-shadow: 0 0 30px rgba(42, 212, 255, 0.35);
  }
  .game-card img {
    width: 84px;
    height: 84px;
    object-fit: contain;
    filter: drop-shadow(0 0 14px rgba(107, 214, 255, 0.6));
  }
  .game-card .game-title {
    font-size: 20px;
    letter-spacing: 2px;
    color: #9be7ff;
    text-shadow: 0 0 8px rgba(107, 214, 255, 0.6);
  }
  .game-card .game-desc {
    font-size: 13px;
    color: #a9c4d8;
    text-align: center;
    line-height: 1.5;
  }
  .game-card .game-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .game-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(107, 214, 255, 0.12);
    border: 1px solid rgba(107, 214, 255, 0.35);
    color: #7fd4ff;
    letter-spacing: 0.5px;
  }

  #footerHint {
    color: #6f8faf;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.7;
  }

</style>
</head>
<body>

<div id="wrap">
  <div id="title">АРКАДЫ</div>
  <div id="games">
    <a class="game-card" href="raketniy-boy.html">
      <img src="img/ship.png" alt="Ракетный бой">
      <div class="game-title">РАКЕТНЫЙ БОЙ</div>
      <div class="game-desc">Уничтожь бота-манекена в невесомости. Собирай коробки со случайным оружием.</div>
      <div class="game-tags">
        <span class="game-tag">1 игрок</span>
        <span class="game-tag">2 игрока</span>
      </div>
    </a>

    <a class="game-card" href="tanks.html">
      <img src="assets/tanks/remastered/PNG/Default size/tank_blue.png" alt="Захват флага">
      <div class="game-title">ЗАХВАТ ФЛАГА</div>
      <div class="game-desc">Принеси флаг бота на свою базу быстрее, чем он твой. В центре — захватываемая турель, в коробках — мины, тройные ракеты и смертельный щит.</div>
      <div class="game-tags">
        <span class="game-tag">1 игрок vs бот</span>
      </div>
    </a>
  </div>
  <div id="footerHint">Выбери игру</div>
</div>

</body>
</html>
